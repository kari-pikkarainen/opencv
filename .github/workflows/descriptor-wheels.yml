name: descriptor-wheels

# Temporary, fork-only check: BRISK and FREAK regression data against released wheels per platform. Not part of any PR.
on:
  push:
    branches: [ci/test-batch-measure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, version: "4.2.0.34", py: "3.8"}
          - {os: ubuntu-22.04, version: "4.3.0.38", py: "3.8"}
          - {os: ubuntu-22.04, version: "4.4.0.46", py: "3.8"}
          - {os: ubuntu-22.04, version: "4.5.1.48", py: "3.8"}
          - {os: ubuntu-22.04, version: "4.5.3.56", py: "3.8"}
          - {os: ubuntu-24.04, version: "4.12.0.88", py: "3.12"}
          - {os: ubuntu-24.04, version: "4.14.0.94", py: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    name: ${{ matrix.os }} / ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: ci-tools
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Test data (features2d only)
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 -b 4.x https://github.com/opencv/opencv_extra.git extra
          cd extra && MSYS_NO_PATHCONV=1 git sparse-checkout set --no-cone 'testdata/cv/features2d/' && git checkout
      - name: Install wheel
        shell: bash
        run: python -m pip install "opencv-contrib-python-headless==${{ matrix.version }}" && python -c "import cv2, numpy; print(cv2.__version__, numpy.__version__)"
      - name: Check
        shell: bash
        run: |
          echo "=== RESULTS ${{ matrix.os }} / ${{ matrix.version }} ($(python -c 'import platform; print(platform.machine())'))"
          python ci-tools/brisk_check.py extra/testdata || true
          python ci-tools/freak_check.py extra/testdata || true
