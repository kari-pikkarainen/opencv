name: descriptor-wheels

# Temporary, fork-only check: BRISK and FREAK regression data against released wheels per platform. Not part of any PR.
on:
  push:
    branches: [ci/test-batch-measure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]
        version: ["4.5.5.64", "4.12.0.88", "4.14.0.94"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    name: ${{ matrix.os }} / ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: ci-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Test data (features2d only)
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 -b 4.x https://github.com/opencv/opencv_extra.git extra
          cd extra && MSYS_NO_PATHCONV=1 git sparse-checkout set --no-cone 'testdata/cv/features2d/' && git checkout
      - name: Install wheel
        shell: bash
        run: python -m pip install "numpy<2" "opencv-contrib-python-headless==${{ matrix.version }}"
      - name: Check
        shell: bash
        run: |
          echo "=== RESULTS ${{ matrix.os }} / ${{ matrix.version }} ($(python -c 'import platform; print(platform.machine())'))"
          python ci-tools/brisk_check.py extra/testdata || true
          python ci-tools/freak_check.py extra/testdata || true
